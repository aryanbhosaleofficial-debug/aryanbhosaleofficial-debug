<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f2240"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#30363d"/>
  </pattern>
  <clipPath id="card"><rect width="1000" height="280" rx="16"/></clipPath>
</defs>
<style>
  .fade { opacity:0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay:.1s } .d2 { animation-delay:.35s } .d3 { animation-delay:.6s } .d4 { animation-delay:.85s }
  @keyframes up { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
  .edge { stroke:#58a6ff; stroke-opacity:.14; stroke-width:1 }
  .node { fill:#0d1117; stroke:#58a6ff; stroke-width:2 }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin:center }
  @keyframes pulse { 0%,100% { fill:#0d1117 } 50% { fill:#1f6feb } }
  .caret { animation: blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity:0 } }
</style>
<g clip-path="url(#card)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#dots)" opacity=".5"/>
  <rect width="1000" height="280" fill="url(#glow)"/>
</g>
