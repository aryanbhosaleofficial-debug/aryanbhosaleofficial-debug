</defs>
<style>
  .blk { animation: lift 6.0s ease-in-out infinite }
  @keyframes lift { 0%,100% { transform:translateY(0) } 7%,17% { transform:translateY(-12px) } 26% { transform:translateY(0) } }
  .on { opacity:0; animation: on 6.0s ease-in-out infinite }
  @keyframes on { 0%,100% { opacity:0 } 7%,17% { opacity:1 } 26% { opacity:0 } }
  .sh { animation: sh 6.0s ease-in-out infinite; transform-box: fill-box; transform-origin:center }
  @keyframes sh { 0%,100% { transform:scale(1); opacity:1 } 7%,17% { transform:scale(.8); opacity:.6 } 26% { transform:scale(1); opacity:1 } }
  .track { stroke-dasharray:6 8; animation: dash 1s linear infinite } @keyframes dash { to { stroke-dashoffset:-14 } }
</style>
<text x="50" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#58a6ff" letter-spacing="1.5">&gt; FROM DATA TO PRODUCTION</text>
