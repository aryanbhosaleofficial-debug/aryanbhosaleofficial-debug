  <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".7"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
  <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern>
  <clipPath id="pclip"><rect width="1000" height="290" rx="16"/></clipPath>
</defs>
<g clip-path="url(#pclip)">
  <rect width="1000" height="290" fill="url(#pbg)"/>
  <rect width="1000" height="290" fill="url(#pdots)" opacity=".45"/>
