<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="ML workflow: data, preprocess, train, evaluate, deploy">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f2240"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#79c0ff"/>
  </linearGradient>
</defs>
<style>
  .box { fill:#161b22; stroke:#30363d; stroke-width:1.5; animation: hl 6.0s ease-in-out infinite }
  @keyframes hl { 0%,100% { stroke:#30363d; fill:#161b22 } 6%,16% { stroke:#58a6ff; fill:#0f2a4d } 24% { stroke:#30363d; fill:#161b22 } }
  .wire { stroke:url(#flow); stroke-width:2; stroke-dasharray:6 8; animation: dash 1s linear infinite; opacity:.8 }
  @keyframes dash { to { stroke-dashoffset:-14 } }
</style>
<rect x=".5" y=".5" width="999" height="229" rx="16" fill="url(#bg2)" stroke="#30363d"/>
<text x="50" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#58a6ff" letter-spacing="1">&gt; FROM DATA TO PRODUCTION</text>
<line class="wire" x1="200.0" y1="118" x2="800.0" y2="118"/>
<circle r="5" fill="#79c0ff" opacity="0"><animateMotion dur="6.0s" repeatCount="indefinite" path="M125.0,118 L875.0,118" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.78;.82;1" dur="6.0s" repeatCount="indefinite"/></circle>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect class="box" x="50.0" y="83.0" width="150" height="70" rx="12" style="animation-delay:-0.66s"/>
  <text x="66.0" y="112" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#58a6ff">01</text>
  <text x="66.0" y="136" font-size="18" font-weight="600" fill="#f0f6fc">Data</text>
  <text x="125.0" y="181.0" font-size="13" fill="#8b949e" text-anchor="middle">Ingest &amp; store</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect class="box" x="237.5" y="83.0" width="150" height="70" rx="12" style="animation-delay:0.54s"/>
  <text x="253.5" y="112" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#58a6ff">02</text>
  <text x="253.5" y="136" font-size="18" font-weight="600" fill="#f0f6fc">Preprocess</text>
  <text x="312.5" y="181.0" font-size="13" fill="#8b949e" text-anchor="middle">Clean &amp; engineer features</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect class="box" x="425.0" y="83.0" width="150" height="70" rx="12" style="animation-delay:1.74s"/>
  <text x="441.0" y="112" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#58a6ff">03</text>
  <text x="441.0" y="136" font-size="18" font-weight="600" fill="#f0f6fc">Train</text>
  <text x="500.0" y="181.0" font-size="13" fill="#8b949e" text-anchor="middle">Fit &amp; tune models</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect class="box" x="612.5" y="83.0" width="150" height="70" rx="12" style="animation-delay:2.94s"/>
  <text x="628.5" y="112" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#58a6ff">04</text>
  <text x="628.5" y="136" font-size="18" font-weight="600" fill="#f0f6fc">Evaluate</text>
  <text x="687.5" y="181.0" font-size="13" fill="#8b949e" text-anchor="middle">Validate on metrics</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect class="box" x="800.0" y="83.0" width="150" height="70" rx="12" style="animation-delay:4.14s"/>
  <text x="816.0" y="112" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#58a6ff">05</text>
  <text x="816.0" y="136" font-size="18" font-weight="600" fill="#f0f6fc">Deploy</text>
  <text x="875.0" y="181.0" font-size="13" fill="#8b949e" text-anchor="middle">Serve as an API</text>
</g>
</svg>